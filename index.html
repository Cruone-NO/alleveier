<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Alle Veier</title>
    <style>
        body {
            background-color: #22c55e;
            font-family: sans-serif;
            text-align: center;
            padding: 40px 20px;
            color: #ffffff;
            margin: 0;
        }
        .vits-boks {
            background-color: #facc15;
            color: #000000;
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            margin: 0 auto 30px auto;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .bilde-container {
            max-width: 600px;
            margin: 0 auto;
        }
        img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="vits-boks">
        Hva sa den ene snømannen til den andre?<br>
        – Kjenner du også at det lukter gulerot her?
    </div>

    <div class="bilde-container">
        <img src="bilde.jpg" alt="Katt åpner julegave fra bestefar som er en hest under juletreet">
    </div>

</body>
</html>
